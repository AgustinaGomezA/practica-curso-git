<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
        }

        a,
        button {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            background: white;
            color: #764ba2;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: .3s;
        }

        a:hover,
        button:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <div>
        <h1>Hola Mundo 🚀</h1>
        <p>Mi primera web con enlace.</p>

        <button onclick="saludar()">Saludar</button>

        <!-- Link para ir a otra página -->
        <a href="https://www.google.com" target="_blank">Ir a Google</a>
    </div>

    <script>
        function saludar() {
            alert("¡Seguís aprendiendo! 😎");
        }
    </script>

</body>

</html>
